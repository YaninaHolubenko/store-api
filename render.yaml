services:
  - type: web
    name: store-api
    env: node
    region: frankfurt
    plan: free
    autoDeploy: true
    buildCommand: "npm ci"
    startCommand: "npm start"
    healthCheckPath: "/healthz"
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: CLIENT_URLS
        value: "https://store-client-ltdg.onrender.com,http://localhost:5173"

      - key: CLIENT_URL
        value: "https://store-client-ltdg.onrender.com"

      - key: STRIPE_CURRENCY
        value: gbp

      - key: SWAGGER_ENABLED
        value: "true"

      - key: SESSION_TTL_MS
        value: "604800000"